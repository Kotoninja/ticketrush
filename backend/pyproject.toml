[project]
name = "ticketrush"
version = "0.1.0"
authors = [{name = "Artem", tg = "koton1nja"}]
description = "A high-speed ticket booking system designed for rapid event reservation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref==3.11.1",
    "attrs==26.1.0",
    "celery>=5.6.3",
    "coverage==7.15.0",
    "django==6.0.6",
    "django-celery-results>=2.6.0",
    "django-debug-toolbar>=7.0.0",
    "django-environ==0.14.0",
    "djangorestframework==3.17.1",
    "drf-spectacular==0.29.0",
    "drf-standardized-errors==0.16.0",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "psycopg==3.3.4",
    "pyyaml==6.0.3",
    "redis[hiredis]>=8.0.1",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
    "sqlparse==0.5.5",
    "typing-extensions==4.16.0",
    "uritemplate==4.2.0",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/tests.py",
    "config/*",
    "manage.py",
    "*apps.py",
    "*wsgi.py",
    "*asgi.py",
    "user/managers.py"
]
